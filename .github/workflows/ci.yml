name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint e test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # In sviluppo PHP e Postgres girano in Docker (ADR-003); la CI usa i
    # runner nativi per velocità. Tenere allineate le versioni a
    # docker/php/Dockerfile (PHP) e compose.yaml (Postgres).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cockpit
          POSTGRES_PASSWORD: cockpit-dev-password
          POSTGRES_DB: cockpit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cockpit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cockpit_test
      DB_USERNAME: cockpit
      DB_PASSWORD: cockpit-dev-password

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, pgsql, zip, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        run: vendor/bin/pest
